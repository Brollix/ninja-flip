# Stack local: mismas imágenes que Cloud Run, sin GCP. DATABASE_URL sale del
# .env (Neon/Supabase) — no hay Postgres local. "tunnel" expone "web" con un
# quick tunnel de Cloudflare: la URL *.trycloudflare.com cambia en cada arranque
# (docker compose logs tunnel).
services:
  web:
    build: { context: ., dockerfile: server/Dockerfile }
    env_file: .env
    environment:
      PORT: "8080"
      # Fuera de GCP no hay metadata server: fetchIdToken devuelve null y la
      # llamada sale sin Bearer, que "report" acá no exige.
      REPORT_SERVICE_URL: http://report:8080
      # pg (Node) trata sslmode=require como verify-full y rechaza la cadena
      # del pooler de Supabase; con esto usa la semántica de libpq (cifra sin
      # verificar CA), igual que psycopg en report/scanner.
      DATABASE_URL: ${DATABASE_URL}&uselibpqcompat=true
    ports: ["8080:8080"]
    depends_on: [report]
    restart: unless-stopped

  report:
    build: { context: ., dockerfile: scripts/Dockerfile.report }
    env_file: .env
    restart: unless-stopped

  # En Cloud Run era un Job disparado cada 10 min por Scheduler.
  scanner:
    build: { context: ., dockerfile: scripts/Dockerfile.scanner }
    env_file: .env
    command: ["sh", "-c", "while true; do python flips.py; sleep 600; done"]
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:2025.8.0
    command: tunnel --no-autoupdate --url http://web:8080
    depends_on: [web]
    restart: unless-stopped
